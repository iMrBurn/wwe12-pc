# WWE '12 PC settings. Edit with any text editor (Notepad works), then restart the game.
# Command line options (--name=value) take priority over this file.

# ---------------------------------------------------------------------------------------------
# Game
# ---------------------------------------------------------------------------------------------

# Game language: 1 English, 3 German, 4 French, 5 Spanish, 6 Italian.
user_language = 1

# Main menu: SHOP becomes EXIT (quits the game) and Xbox LIVE is labelled Online.
wwe12_quit_entry = true

# OPTIONS menu: "IN-GAME MANUAL" becomes GRAPHICS, a screen to change the settings below in game.
wwe12_graphics_menu = true

# Skip the start-up videos (logos and opening) to reach the title screen faster.
wwe12_skip_intros = true

# ---------------------------------------------------------------------------------------------
# Graphics
# ---------------------------------------------------------------------------------------------

# Internal resolution: 0 = automatic (from your screen; 720p on Steam Deck and on graphics built
# into the processor), 540, 720, 1080, 1440 or 2160 (4K). If the game runs slowly, set 720, or 540
# on the weakest graphics built into the processor.
svr_render_scale = 0

# 60 fps in entrances and cutscenes (experimental; the original game drops to 30 there).
# Known issue: title belts carried on a shoulder can move oddly at 60 fps.
wwe12_60fps = false

# Sharpness of textures seen at an angle (ring, ramp, crowd): 0 (off), 2, 4, 8 or 16.
bd_anisotropy = 16

# Anti-aliasing (smooth edges): 0 (off), 2, 4 or 8. Heavier on the graphics card as it grows.
bd_msaa = 4

# Depth of field (blur behind the wrestlers): 1.0 = the game's own blur, 0.0 = off.
bd_dof_strength = 1.0

# Shadows: resolution of the sun's shadow map (512, 1024, 2048, 4096 or 8192) and how far they
# reach (1.0 = the Xbox 360's distance, up to 4.0).
bd_shadow_dimension = 4096
bd_shadow_distance = 2.0

# Draw the crowd. false = empty stands, much lighter on small PCs.
wwe12_crowd = true

# The console's own edge-blur filter (its anti-aliasing). false keeps the picture sharp.
svr_edge_blur = false

# Vertical sync: true avoids tearing (horizontal cuts in the picture).
bd_vsync = true

# Graphics card to use, by name (empty = automatic). Laptop with two graphics cards: rather set
# wwe12.exe to "High performance" in Windows Settings > System > Display > Graphics, and plug in
# the charger (some laptops turn the dedicated card off on battery).
svr_gpu_device = ""

# Window: fullscreen = true is full screen. With fullscreen = false the game runs in a window of
# window_width x window_height pixels (0 = the game's default size); borderless = true removes the
# window's title bar and frame. Applied at the next start.
fullscreen = true
borderless = false
window_width = 0
window_height = 0

# FPS counter at the top left of the picture; F2 shows or hides it while playing.
wwe12_show_fps = false

# Frame limit: 0 = none. The game is paced at 60 frames per second by its own clock, so values above
# 60 change nothing, and values below 60 slow the game down (30 = half speed).
wwe12_fps_limit = 0

# CPU priority of the game: 0 normal, 1 above normal, 2 high (may slow your other programs).
wwe12_cpu_priority = 0

# ---------------------------------------------------------------------------------------------
# Controls
# ---------------------------------------------------------------------------------------------

# Xbox and PlayStation controllers (DualShock 4, DualSense) work out of the box.
# Keyboard for player 1, usable together with a controller. Each binding can list several keys
# separated by commas; ZQSD and WASD both work (AZERTY and QWERTY keyboards).
mnk_mode = true

# Which player the keyboard is: 1 shares player 1 with controller 1; 2 makes the keyboard a separate
# controller (player 2) next to a controller that stays player 1, to play with a friend; 3 or 4 also work.
mnk_player = 1

# Your own music for created wrestlers: the "music" folder next to the game (mp3, m4a, aac, wma, wav, flac).
# xmp_music_folder = another folder (empty = "music"); xmp_music_level_db = loudness, -40 to -6 (-20 = like the game).
xmp_music_folder = ""
xmp_music_level_db = -20

# Button icons shown by the game: "auto" (PlayStation icons when a PlayStation controller is plugged
# in when the game starts), "xbox" or "playstation".
wwe12_button_icons = "auto"

keybind_lstick_up = "Z,W"
keybind_lstick_left = "Q,A"
keybind_lstick_down = "S"
keybind_lstick_right = "D"
keybind_rstick_up = "Up"
keybind_rstick_down = "Down"
keybind_rstick_left = "Left"
keybind_rstick_right = "Right"
keybind_x = "J"
keybind_a = "K"
keybind_b = "L"
keybind_y = "I"
keybind_left_shoulder = "U"
keybind_right_shoulder = "O"
keybind_left_trigger = "R"
keybind_right_trigger = "Space"
keybind_lstick_press = "C"
keybind_rstick_press = "N"
keybind_dpad_up = "T"
keybind_dpad_down = "G"
keybind_dpad_left = "F"
keybind_dpad_right = "H"
keybind_start = "Return,Escape"
keybind_back = "Tab,Backspace"

# ---------------------------------------------------------------------------------------------
# Advanced (leave as is)
# ---------------------------------------------------------------------------------------------

# Milliseconds of loading per loading-screen frame (the original game: 0 to 1, paced for the DVD
# drive). 12 loads matches about twice as fast; 0 keeps the original pace.
wwe12_load_slice_ms = 12

# Loading screens run the game as fast as possible until the entrance starts (shorter match loads;
# the loading animation spins faster). Experimental: it can hang a load on some PCs; false keeps the
# original pace.
wwe12_load_turbo = false

# Settings of the emulated Xbox 360 GPU, kept for its fallback mode (the port normally draws
# with its own native Vulkan renderer).
gpu_allow_invalid_fetch_constants = true
gpu_backend = "vulkan"
d3d12_readback_memexport = true
vulkan_readback_memexport = true
async_shader_compilation = false
