# Réglages d'exécution par défaut de WWE '12, copiés à côté de wwe12.exe à chaque compilation.
# (Les réglages de codegen sont ailleurs : port/wwe12_config.toml.)
# Les options de la ligne de commande (--nom=valeur) restent prioritaires.

# Le jeu envoie des milliers de descripteurs de texture que l'émulation Xenos juge
# invalides (plusieurs centaines d'avertissements par seconde). Comme pour d'autres
# jeux WWE de cette génération sous Xenia, on les accepte.
gpu_allow_invalid_fetch_constants = true

# Rendu : Vulkan par défaut, car c'est le seul stable (aucun plantage). Direct3D 12 a des
# entrées parfaites mais bloque encore le GPU (DEVICE_HUNG) en match : en cours de correction,
# à tester avec --gpu_backend=d3d12. Sur un PC portable à deux GPU, régler wwe12.exe sur
# « Hautes performances » dans Paramètres > Écran > Graphiques, sinon Vulkan ne voit que
# le GPU intégré (et brancher le chargeur : la RTX est coupée sur batterie).
gpu_backend = "vulkan"

# Les catcheurs des entrées sont animés par des shaders « memexport » (écriture directe en
# mémoire GPU) : il faut relire ces données côté CPU. Sans ça, Vulkan les rend invisibles
# (seule leur ombre s'affiche) ; on l'active aussi pour D3D12.
d3d12_readback_memexport = true
vulkan_readback_memexport = true

# Shaders « comme un jeu PC » : au démarrage, tout le cache (Documents\wwe12\cache) est
# compilé avant que le jeu commence. Un effet encore jamais vu est compilé sur le moment,
# en attendant qu'il soit prêt (courte pause) au lieu de sauter son draw (écran noir de
# 1 à 5 s), puis ajouté au cache : ces pauses disparaissent au fil des parties.
async_shader_compilation = false

# Langue du jeu (comme le réglage de la console) : 1 anglais, 3 allemand, 4 français,
# 5 espagnol, 6 italien. La version européenne du jeu contient ces cinq langues.
user_language = 1

# Filtrage anisotrope (0 = désactivé, 2/4/8/16) : garde nettes les textures vues en biais
# (sol, rampe, tapis du ring, public). Coût quasi nul sur une carte graphique récente.
bd_anisotropy = 16

# Clavier (joueur 1, en plus de la manette : les deux marchent en même temps). Les manettes Xbox
# et PlayStation (DualShock 4, DualSense) sont reconnues d'office. Chaque touche peut avoir
# plusieurs choix séparés par des virgules ; ZQSD et WASD marchent tous les deux (AZERTY/QWERTY).
mnk_mode = true
keybind_lstick_up = "Z,W"
keybind_lstick_left = "Q,A"
keybind_lstick_down = "S"
keybind_lstick_right = "D"
keybind_rstick_up = "Up"
keybind_rstick_down = "Down"
keybind_rstick_left = "Left"
keybind_rstick_right = "Right"
keybind_x = "J"
keybind_a = "K"
keybind_b = "L"
keybind_y = "I"
keybind_left_shoulder = "U"
keybind_right_shoulder = "O"
keybind_left_trigger = "R"
keybind_right_trigger = "Space"
keybind_lstick_press = "C"
keybind_rstick_press = "N"
keybind_dpad_up = "T"
keybind_dpad_down = "G"
keybind_dpad_left = "F"
keybind_dpad_right = "H"
keybind_start = "Return,Escape"
keybind_back = "Tab,Backspace"
